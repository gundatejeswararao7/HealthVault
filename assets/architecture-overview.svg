<text x="810.0" y="93.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Admin and insurer portal</text>
<text x="810.0" y="113.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Govt review, insurer review</text>
