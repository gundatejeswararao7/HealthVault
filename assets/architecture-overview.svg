<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Three application architecture</title>
<rect x="0" y="0" width="1000" height="420" fill="#0d1117"/>
<defs>
