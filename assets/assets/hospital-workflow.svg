<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Hospital case submission workflow</title>
<rect x="0" y="0" width="1000" height="320" fill="#0d1117"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#8b949e"/>
</marker>
</defs>
<rect x="50" y="50" width="260" height="90" rx="12" fill="#378ADD" stroke="#1a4fb4" stroke-width="1.5"/>
<text x="180.0" y="88.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1. Verify patient</text>
<text x="180.0" y="108.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Mobile number + Patient ID</text>
<rect x="370" y="50" width="260" height="90" rx="12" fill="#378ADD" stroke="#1a4fb4" stroke-width="1.5"/>
<text x="500.0" y="88.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2. Identity OTP</text>
<text x="500.0" y="108.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Confirms who the patient is</text>
<rect x="690" y="50" width="260" height="90" rx="12" fill="#F7B32B" stroke="#B9850D" stroke-width="1.5"/>
<text x="820.0" y="88.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">3. Case form</text>
<text x="820.0" y="108.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#1a1a1a" opacity="0.9">Doctor, diagnosis, treatments</text>
<rect x="50" y="200" width="260" height="90" rx="12" fill="#E7352C" stroke="#A52018" stroke-width="1.5"/>
<text x="180.0" y="238.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4. Secret code</text>
<text x="180.0" y="258.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Patient confirms on their app</text>
<rect x="370" y="200" width="260" height="90" rx="12" fill="#E7352C" stroke="#A52018" stroke-width="1.5"/>
<text x="500.0" y="238.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">5. Upload docs</text>
<text x="500.0" y="258.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Only after patient confirms</text>
<rect x="690" y="200" width="260" height="90" rx="12" fill="#1A9E75" stroke="#0f6e5e" stroke-width="1.5"/>
<text x="820.0" y="238.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">6. Submit case</text>
<text x="820.0" y="258.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Now visible to the patient</text>
<line x1="310" y1="95.0" x2="370" y2="95.0" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630" y1="95.0" x2="690" y2="95.0" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 820.0 140 L 820.0 170 L 180.0 170 L 180.0 200" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="310" y1="245.0" x2="370" y2="245.0" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630" y1="245.0" x2="690" y2="245.0" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>