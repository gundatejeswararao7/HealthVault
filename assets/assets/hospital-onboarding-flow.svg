<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Hospital branch onboarding flow</title>
<rect x="0" y="0" width="1000" height="240" fill="#0d1117"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#8b949e"/>
</marker>
</defs>
<rect x="40" y="80" width="230" height="70" rx="12" fill="#E7352C" stroke="#A52018" stroke-width="1.5"/>
<text x="155.0" y="108.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Branch submits application</text>
<text x="155.0" y="128.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">License + branch details</text>
<rect x="320" y="80" width="220" height="70" rx="12" fill="#7F77DD" stroke="#534AB7" stroke-width="1.5"/>
<text x="430.0" y="108.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Admin reviews</text>
<text x="430.0" y="128.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">License authenticity, compliance</text>
<polygon points="670,70.0 740.0,115 670,160.0 600.0,115" fill="#7F77DD" stroke="#534AB7" stroke-width="1.5"/>
<text x="670" y="119" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Decision</text>
<rect x="860" y="30" width="120" height="70" rx="12" fill="#47A248" stroke="#2c6e2d" stroke-width="1.5"/>
<text x="920.0" y="58.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Active</text>
<text x="920.0" y="78.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Can log in and operate</text>
<rect x="860" y="150" width="120" height="70" rx="12" fill="#E7352C" stroke="#A52018" stroke-width="1.5"/>
<text x="920.0" y="178.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Rejected</text>
<text x="920.0" y="198.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Flagged, blocked</text>
<line x1="270" y1="115" x2="318" y2="115" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540" y1="115" x2="600" y2="115" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 720 85 L 790 65 L 858 65" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 720 145 L 790 165 L 858 185" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>