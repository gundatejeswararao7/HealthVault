<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Patient login methods</title>
<rect x="0" y="0" width="1000" height="300" fill="#0d1117"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#8b949e"/>
</marker>
</defs>
<rect x="30" y="110" width="190" height="80" rx="12" fill="#4b5563" stroke="#333a44" stroke-width="1.5"/>
<text x="125.0" y="143.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Patient / family member</text>
<text x="125.0" y="163.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.9">Opens patient website</text>
<rect x="280" y="40" width="230" height="90" rx="12" fill="#1A9E75" stroke="#0f6e5e" stroke-width="1.5"/>
<text x="395.0" y="78.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Profile ID + password</text>
<text x="395.0" y="98.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.9">Primary account only</text>
<rect x="280" y="170" width="230" height="90" rx="12" fill="#F7B32B" stroke="#B9850D" stroke-width="1.5"/>
<text x="395.0" y="208.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Mobile + OTP</text>
<text x="395.0" y="228.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="10" fill="#1a1a1a" opacity="0.9">Primary or family</text>
<rect x="560" y="40" width="230" height="90" rx="12" fill="#1A9E75" stroke="#0f6e5e" stroke-width="1.5"/>
<text x="675.0" y="78.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Aadhaar + OTP</text>
<text x="675.0" y="98.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.9">+ mobile as 2nd factor</text>
<rect x="560" y="170" width="230" height="90" rx="12" fill="#F7B32B" stroke="#B9850D" stroke-width="1.5"/>
<text x="675.0" y="208.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">PAN + DOB + mobile</text>
<text x="675.0" y="228.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="10" fill="#1a1a1a" opacity="0.9">Verified instantly, no OTP</text>
<rect x="840" y="110" width="130" height="80" rx="12" fill="#378ADD" stroke="#1a4fb4" stroke-width="1.5"/>
<text x="905.0" y="143.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Dashboard</text>
<text x="905.0" y="163.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.9">Policies, cases, claims</text>
<path d="M 220 150.0 L 240 150.0 L 240 85.0 L 280 85.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 220 150.0 L 240 150.0 L 240 215.0 L 280 215.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 220 150.0 L 240 150.0 L 240 85.0 L 560 85.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 220 150.0 L 240 150.0 L 240 215.0 L 560 215.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 510 85.0 L 820 85.0 L 820 150.0 L 840 150.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 510 215.0 L 820 215.0 L 820 150.0 L 840 150.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 790 85.0 L 820 85.0 L 820 150.0 L 840 150.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 790 215.0 L 820 215.0 L 820 150.0 L 840 150.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>