<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Family member enrollment and approval flow</title>
<rect x="0" y="0" width="1000" height="240" fill="#0d1117"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#8b949e"/>
</marker>
</defs>
<rect x="40" y="80" width="200" height="70" rx="12" fill="#1A9E75" stroke="#0f6e5e" stroke-width="1.5"/>
<text x="140.0" y="108.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Patient submits request</text>
<text x="140.0" y="128.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Add a dependent</text>
<rect x="300" y="80" width="220" height="70" rx="12" fill="#7F77DD" stroke="#534AB7" stroke-width="1.5"/>
<text x="410.0" y="108.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Insurer reviews</text>
<text x="410.0" y="128.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Coverage, limits, eligibility</text>
<polygon points="650,70.0 720.0,115 650,160.0 580.0,115" fill="#7F77DD" stroke="#534AB7" stroke-width="1.5"/>
<text x="650" y="119" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Decision</text>
<rect x="840" y="30" width="140" height="70" rx="12" fill="#47A248" stroke="#2c6e2d" stroke-width="1.5"/>
<text x="910.0" y="58.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Approved</text>
<text x="910.0" y="78.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Linked to policy</text>
<rect x="840" y="150" width="140" height="70" rx="12" fill="#E7352C" stroke="#A52018" stroke-width="1.5"/>
<text x="910.0" y="178.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Rejected</text>
<text x="910.0" y="198.0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Reason sent to patient</text>
<line x1="240" y1="115" x2="298" y2="115" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520" y1="115" x2="580" y2="115" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 700 85 L 770 65 L 838 65" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 700 145 L 770 165 L 838 185" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>